<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WBS — Content Transformer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Spline+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1ECE2;--paper-2:#FBF9F3;--card:#fff;
  --ink:#211F1A;--ink-soft:#5C584D;--ink-faint:#94907F;
  --line:#DBD5C5;--line-soft:#E8E3D6;--accent:#BE4A22;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Spline Sans',sans-serif;
  background:var(--paper);
  background-image:radial-gradient(var(--line) 0.6px,transparent 0.6px);
  background-size:22px 22px;
  color:var(--ink);
  height:100vh;display:flex;flex-direction:column;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}

/* ── HEADER ── */
.hdr{
  flex:none;background:var(--paper-2);
  border-bottom:1px solid var(--line);
  padding:12px 24px;display:flex;align-items:center;gap:18px;
  z-index:10;box-shadow:0 4px 12px rgba(33,31,26,.05);
}
.hdr-left{flex:1;}
.kicker{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:3px;
}
.hdr h1{
  font-family:'Fraunces',serif;font-size:22px;font-weight:500;
  letter-spacing:-.01em;line-height:1;
}
.hdr h1 em{font-style:italic;color:var(--accent);}
.pills{display:flex;gap:7px;flex-wrap:wrap;}
.pill{
  font-size:11px;font-family:'IBM Plex Mono',monospace;
  padding:4px 10px;border-radius:20px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-soft);font-weight:600;white-space:nowrap;
}
.hdr-btns{display:flex;gap:7px;}
.btn{
  font-family:inherit;font-size:12px;font-weight:600;
  padding:7px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--paper-2);color:var(--ink);cursor:pointer;
}
.btn:hover{background:var(--card);border-color:var(--ink-faint);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.primary:hover{background:#a83d18;}

/* ── LEGEND ── */
.leg-bar{
  flex:none;display:flex;align-items:center;gap:18px;
  padding:7px 24px;background:var(--card);
  border-bottom:1px solid var(--line);
  overflow-x:auto;font-size:12px;color:var(--ink-soft);
  scrollbar-width:none;
}
.leg-bar::-webkit-scrollbar{display:none;}
.leg-item{display:flex;align-items:center;gap:6px;white-space:nowrap;}
.leg-dot{width:10px;height:10px;border-radius:2px;flex:none;}
.leg-label-sm{font-family:'IBM Plex Mono',monospace;font-size:10px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);margin-right:4px;}

/* ── VIEWPORT ── */
.vp{
  flex:1;overflow:auto;position:relative;cursor:grab;
}
.vp:active{cursor:grabbing;}
.vp::-webkit-scrollbar{width:7px;height:7px;}
.vp::-webkit-scrollbar-track{background:transparent;}
.vp::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.canvas{position:relative;}

/* SVG */
.tree-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;}

/* ── NODES ── */
.wbs-node{
  position:absolute;border-radius:10px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  cursor:pointer;user-select:none;padding:8px 10px;border:1.5px solid transparent;
  transition:box-shadow .15s,transform .15s,opacity .2s;
}
.wbs-node:hover{transform:translateY(-2px);}
.wbs-node:active{transform:scale(.97);}
.node-code{
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:.1em;margin-bottom:3px;opacity:.75;
}
.node-label{font-weight:600;line-height:1.25;}
.node-hint{
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  margin-top:4px;opacity:.55;letter-spacing:.04em;
}

/* ── HINT ── */
.hint-bar{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  background:rgba(33,31,26,.85);color:#fff;font-size:11px;
  font-family:'IBM Plex Mono',monospace;
  padding:7px 18px;border-radius:20px;letter-spacing:.06em;
  pointer-events:none;z-index:200;
  animation:fadein .6s .8s both;
}
@keyframes fadein{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <div class="kicker">UniPi &middot; LEGeNds &middot; 2025&ndash;26</div>
    <h1>Work Breakdown <em>Structure</em></h1>
  </div>
  <div class="pills">
    <span class="pill">6 macro-aree</span>
    <span class="pill" id="pWP">— work package</span>
    <span class="pill" id="pTot">— nodi totali</span>
  </div>
  <div class="hdr-btns">
    <button class="btn" id="btnExp">Espandi tutto</button>
    <button class="btn" id="btnCol">Comprimi L2+</button>
    <button class="btn primary" id="btnFit">↖ Centra</button>
  </div>
</div>

<div class="leg-bar" id="legBar">
  <span class="leg-label-sm">Aree</span>
</div>

<div class="vp" id="vp">
  <div class="canvas" id="canvas">
    <svg class="tree-svg" id="svg"></svg>
  </div>
</div>

<div class="hint-bar">Click per espandere &middot; Scroll per navigare</div>

<script>
/* ═══════════════ AREA PALETTE ═══════════════ */
const AC = [
  {color:"#1e3a5f",bg:"#dce7f3"}, // 0 PM
  {color:"#2D7A57",bg:"#E4EFE8"}, // 1 DES
  {color:"#5A6E2A",bg:"#EBF0D8"}, // 2 FEA
  {color:"#BE4A22",bg:"#F6E3D7"}, // 3 QFD
  {color:"#6B4E9B",bg:"#EDE6F5"}, // 4 CON
  {color:"#8B2020",bg:"#F5E0E0"}, // 5 FME
];

const AREA_LABELS = [
  "Project Management","Desirability","Feasibility",
  "QFD","Concept Design","FMECA"
];

/* ═══════════════ RAW TREE DATA ═══════════════ */
const RAW = {label:"Content Transformer",code:"",children:[
  {label:"Project Management",code:"0",children:[
    {label:"Contesto e problema",code:"0.1"},
    {label:"Obiettivo del progetto",code:"0.2"},
    {label:"Criteri di successo",code:"0.3"},
    {label:"Metodologia",code:"0.4"},
    {label:"Strumenti – PMIS",code:"0.5"},
    {label:"Pianificazione",code:"0.6",children:[
      {label:"Scope Statement",code:"0.6.1"},
      {label:"WBS",code:"0.6.2"},
      {label:"Scheduling – Gantt",code:"0.6.3"},
      {label:"Matrice RACI",code:"0.6.4"},
      {label:"Lessons Learned",code:"0.6.5"},
    ]},
    {label:"Monitoraggio KPI",code:"0.7"},
  ]},
  {label:"Desirability",code:"1",children:[
    {label:"Buyer Persona",code:"1.1"},
    {label:"Customer Workflow Map",code:"1.2"},
    {label:"Point of View iniziale",code:"1.3"},
    {label:"Analisi delle necessità",code:"1.4",children:[
      {label:"Necessità latenti",code:"1.4.1"},
      {label:"Necessità consapevoli",code:"1.4.2"},
      {label:"Lista finale",code:"1.4.3"},
    ]},
    {label:"Elaborazione bisogni",code:"1.5"},
    {label:"Validazione bisogni",code:"1.6",children:[
      {label:"Questionario",code:"1.6.1"},
      {label:"Interviste",code:"1.6.2"},
      {label:"Risultati validazione",code:"1.6.3"},
    ]},
    {label:"Empathy Map",code:"1.7"},
    {label:"POV definitivo",code:"1.8"},
  ]},
  {label:"Feasibility",code:"2",children:[
    {label:"Analisi PESTEL",code:"2.1",children:[
      {label:"Politici",code:"2.1.1"},
      {label:"Economici",code:"2.1.2"},
      {label:"Sociali",code:"2.1.3"},
      {label:"Tecnologici",code:"2.1.4"},
      {label:"Ecologici",code:"2.1.5"},
      {label:"Legali",code:"2.1.6"},
    ]},
    {label:"Analisi del presente",code:"2.2",children:[
      {label:"Google Trends",code:"2.2.1"},
      {label:"Benchmarking",code:"2.2.2"},
      {label:"Curve Schumpeter",code:"2.2.3"},
      {label:"Analisi Scopus",code:"2.2.4"},
      {label:"Stili apprendimento",code:"2.2.5"},
    ]},
    {label:"Strategie innovative",code:"2.3",children:[
      {label:"SCAMPER",code:"2.3.1"},
      {label:"Blue Ocean Strategy",code:"2.3.2"},
    ]},
    {label:"Tre soluzioni ortogonali",code:"2.4",children:[
      {label:"Soluzione A",code:"2.4.1"},
      {label:"Soluzione B",code:"2.4.2"},
      {label:"Soluzione C",code:"2.4.3"},
    ]},
    {label:"Analisi di Fattibilità",code:"2.5"},
  ]},
  {label:"Quality Function Deployment",code:"3",children:[
    {label:"Stanza 1 – Voce cliente",code:"3.1"},
    {label:"Stanza 2 – CTQ",code:"3.2"},
    {label:"Stanza 3 – Relazioni",code:"3.3"},
    {label:"Stanza 4 – Benchm. percezioni",code:"3.4"},
    {label:"Stanza 5 – Benchm. aziendale",code:"3.5"},
    {label:"Stanza 6 – Correlazione",code:"3.6"},
    {label:"Stanza 7 – Req. critici",code:"3.7"},
    {label:"Stanza 8 – Specifiche",code:"3.8"},
    {label:"QFD e costi",code:"3.9"},
  ]},
  {label:"Concept Design",code:"4",children:[
    {label:"Caratteristiche tecniche",code:"4.1",children:[
      {label:"Fondamenti scientifici",code:"4.1.1"},
    ]},
    {label:"Sistema rielaborazione adattivo",code:"4.2",children:[
      {label:"Ontologia",code:"4.2.1"},
      {label:"Rielaborazione reattiva",code:"4.2.2"},
    ]},
    {label:"Prodotto e varianti",code:"4.3",children:[
      {label:"Design ottimale",code:"4.3.1"},
      {label:"Varianti del prodotto",code:"4.3.2"},
    ]},
    {label:"Sviluppo del prototipo",code:"4.4",children:[
      {label:"Formulazione ipotesi",code:"4.4.1"},
      {label:"Sviluppo",code:"4.4.2"},
      {label:"Misura",code:"4.4.3"},
      {label:"Risultato",code:"4.4.4"},
      {label:"Opportunità",code:"4.4.5"},
    ]},
  ]},
  {label:"FMECA",code:"5",children:[
    {label:"Funzioni e modi di guasto",code:"5.1"},
    {label:"Analisi conseguenze e cause",code:"5.2"},
    {label:"Quantificazione RPN",code:"5.3"},
    {label:"Matrice del rischio",code:"5.4"},
  ]},
]};

/* ═══════════════ ENRICH ═══════════════ */
let uid=0;
function enrich(node,level,area){
  node.id=uid++;node.level=level;node.area=area;
  if(!node.children)node.children=[];
  node.collapsed=level>=1;
  node.children.forEach((c,i)=>enrich(c,level+1,level===0?i:area));
}
enrich(RAW,0,-1);

/* ═══════════════ LAYOUT CONSTANTS ═══════════════ */
const NW=155, PAD=60, V_GAP=80, H_UNIT=172;
const NH=[70,58,48,42]; // height per level

function getSpan(n){
  if(n.collapsed||!n.children.length)return 1;
  return n.children.reduce((s,c)=>s+getSpan(c),0);
}

let allNodes=[];
function layout(n,xStart,y){
  const span=getSpan(n);
  const h=NH[Math.min(n.level,NH.length-1)];
  n.x=xStart+span*H_UNIT/2-NW/2;
  n.y=y; n.w=NW; n.h=h;
  allNodes.push(n);
  if(!n.collapsed){
    let cx=xStart;
    n.children.forEach(c=>{const cs=getSpan(c);layout(c,cx,y+h+V_GAP);cx+=cs*H_UNIT;});
  }
}

/* ═══════════════ DOM POOL ═══════════════ */
const canvas=document.getElementById('canvas');
const svgEl=document.getElementById('svg');
const domMap={};

function nodeStyle(n){
  if(n.level===0)return{bg:'#211F1A',fg:'#F1ECE2',border:'#211F1A',codeFg:'rgba(241,236,226,.5)'};
  const ac=AC[n.area];
  if(n.level===1)return{bg:ac.color,fg:'#fff',border:ac.color,codeFg:'rgba(255,255,255,.55)'};
  if(n.level===2)return{bg:'#fff',fg:ac.color,border:ac.color+'66',codeFg:ac.color+'99'};
  return{bg:ac.bg,fg:ac.color,border:ac.color+'44',codeFg:ac.color+'88'};
}

function render(){
  allNodes=[];
  layout(RAW,PAD,PAD);

  // canvas size
  let maxX=0,maxY=0;
  allNodes.forEach(n=>{maxX=Math.max(maxX,n.x+n.w+PAD);maxY=Math.max(maxY,n.y+n.h+PAD);});
  canvas.style.width=maxX+'px';canvas.style.height=maxY+'px';

  const seen=new Set();
  allNodes.forEach(n=>{
    seen.add(n.id);
    let el=domMap[n.id];
    if(!el){
      el=document.createElement('div');
      el.className='wbs-node';
      el.addEventListener('click',()=>{if(n.children.length){n.collapsed=!n.collapsed;render();}});
      canvas.appendChild(el);
      domMap[n.id]=el;
    }
    const st=nodeStyle(n);
    Object.assign(el.style,{
      left:n.x+'px',top:n.y+'px',width:n.w+'px',height:n.h+'px',
      background:st.bg,color:st.fg,borderColor:st.border,
      fontSize:n.level===0?'14px':n.level===1?'12.5px':'11px',
      fontWeight:n.level<=1?'700':'600',
      boxShadow:n.level<=1?'0 2px 8px rgba(33,31,26,.14),0 8px 24px rgba(33,31,26,.1)':'0 1px 4px rgba(33,31,26,.09)',
    });
    const hasKids=n.children.length>0;
    const hint=hasKids?(n.collapsed?`▾ ${n.children.length}`:'▴'):'';
    el.innerHTML=
      (n.level>0?`<div class="node-code" style="color:${st.codeFg}">${n.code}</div>`:'')
      +`<div class="node-label">${n.label}</div>`
      +(hint?`<div class="node-hint" style="color:${st.codeFg}">${hint}</div>`:'');
    el.style.display='flex';
  });

  // remove stale
  Object.keys(domMap).forEach(id=>{
    if(!seen.has(+id)){domMap[id].remove();delete domMap[id];}
  });

  // lines
  const paths=[];
  allNodes.forEach(n=>{
    if(n.collapsed)return;
    n.children.forEach(c=>{
      const x1=n.x+n.w/2,y1=n.y+n.h;
      const x2=c.x+c.w/2,y2=c.y;
      const ym=(y1+y2)/2;
      const ac=AC[c.area];
      const stroke=ac?ac.color+'99':'#DBD5C5';
      const sw=c.level<=2?2:1.4;
      paths.push(`<path d="M${x1},${y1}C${x1},${ym} ${x2},${ym} ${x2},${y2}" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round"/>`);
    });
  });
  svgEl.innerHTML=paths.join('');

  // stats
  const leaves=countLeaves(RAW), total=countAll(RAW);
  document.getElementById('pWP').textContent=leaves+' work package';
  document.getElementById('pTot').textContent=total+' nodi';
}

function countAll(n){return 1+(n.children||[]).reduce((s,c)=>s+countAll(c),0);}
function countLeaves(n){if(!n.children||!n.children.length)return 1;return n.children.reduce((s,c)=>s+countLeaves(c),0);}

/* ═══════════════ LEGEND ═══════════════ */
const lb=document.getElementById('legBar');
AC.forEach((ac,i)=>{
  const sp=document.createElement('span');
  sp.className='leg-item';
  sp.innerHTML=`<span class="leg-dot" style="background:${ac.color}"></span>${i}. ${AREA_LABELS[i]}`;
  lb.appendChild(sp);
});

/* ═══════════════ CONTROLS ═══════════════ */
function setAll(n,v){if(n.children.length){n.collapsed=v;n.children.forEach(c=>setAll(c,v));}}
document.getElementById('btnExp').onclick=()=>{setAll(RAW,false);render();};
document.getElementById('btnCol').onclick=()=>{RAW.children.forEach(c=>setAll(c,true));render();};
document.getElementById('btnFit').onclick=()=>{
  document.getElementById('vp').scrollTo({left:0,top:0,behavior:'smooth'});
};

/* ═══════════════ INIT ═══════════════ */
render();
setTimeout(()=>{
  const vp=document.getElementById('vp');
  const root=domMap[RAW.id];
  if(root) vp.scrollLeft=Math.max(0,parseInt(root.style.left)+NW/2-vp.clientWidth/2);
},60);
</script>
</body>
</html>
