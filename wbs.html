<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WBS — Content Transformer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Spline+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1ECE2;--paper-2:#FBF9F3;--card:#fff;
  --ink:#211F1A;--ink-soft:#5C584D;--ink-faint:#94907F;
  --line:#DBD5C5;--line-soft:#E8E3D6;--accent:#BE4A22;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Spline Sans',sans-serif;
  background:var(--paper);
  background-image:radial-gradient(var(--line) 0.6px,transparent 0.6px);
  background-size:22px 22px;
  color:var(--ink);
  height:100vh;display:flex;flex-direction:column;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}

/* ── HEADER ── */
.hdr{
  flex:none;background:var(--paper-2);
  border-bottom:1px solid var(--line);
  padding:10px 20px;display:flex;align-items:center;gap:14px;
  z-index:10;box-shadow:0 4px 12px rgba(33,31,26,.05);
  flex-wrap:wrap;
}
.hdr-left{flex:1;min-width:200px;}
.kicker{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:3px;
}
.hdr h1{
  font-family:'Fraunces',serif;font-size:20px;font-weight:500;
  letter-spacing:-.01em;line-height:1;
}
.hdr h1 em{font-style:italic;color:var(--accent);}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.pill{
  font-size:11px;font-family:'IBM Plex Mono',monospace;
  padding:3px 9px;border-radius:20px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-soft);font-weight:600;white-space:nowrap;
}
.hdr-btns{display:flex;gap:6px;flex-wrap:wrap;}
.btn{
  font-family:inherit;font-size:11px;font-weight:600;
  padding:6px 11px;border-radius:7px;border:1px solid var(--line);
  background:var(--paper-2);color:var(--ink);cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--card);border-color:var(--ink-faint);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.primary:hover{background:#a83d18;}

/* zoom indicator */
.zoom-badge{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  padding:3px 8px;border-radius:5px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-faint);min-width:46px;text-align:center;
}

/* ── LEGEND ── */
.leg-bar{
  flex:none;display:flex;align-items:center;gap:14px;
  padding:6px 20px;background:var(--card);
  border-bottom:1px solid var(--line);
  overflow-x:auto;font-size:11px;color:var(--ink-soft);
  scrollbar-width:none;
}
.leg-bar::-webkit-scrollbar{display:none;}
.leg-item{display:flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer;padding:2px 4px;border-radius:4px;}
.leg-item:hover{background:var(--paper);}
.leg-dot{width:9px;height:9px;border-radius:2px;flex:none;}
.leg-label-sm{font-family:'IBM Plex Mono',monospace;font-size:10px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);margin-right:4px;}

/* ── VIEWPORT ── */
.vp{
  flex:1;overflow:hidden;position:relative;
  cursor:grab;
}
.vp.dragging{cursor:grabbing;}

/* canvas uses CSS transform for zoom+pan */
.canvas-wrap{
  position:absolute;top:0;left:0;
  transform-origin:0 0;
  will-change:transform;
}
.canvas{position:relative;}

/* SVG */
.tree-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;}

/* ── NODES ── */
.wbs-node{
  position:absolute;border-radius:10px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  cursor:pointer;user-select:none;padding:7px 9px;border:1.5px solid transparent;
  transition:box-shadow .15s,opacity .2s,filter .15s;
}
.wbs-node:hover{filter:brightness(1.07);}
.wbs-node:active{filter:brightness(.95);}
.node-code{
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:.1em;margin-bottom:3px;opacity:.75;
}
.node-label{font-weight:600;line-height:1.25;}
.node-hint{
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  margin-top:3px;opacity:.55;letter-spacing:.04em;
}

/* ── TOOLTIP ── */
.tooltip{
  position:fixed;pointer-events:none;z-index:300;
  background:rgba(33,31,26,.92);color:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  padding:5px 10px;border-radius:6px;letter-spacing:.04em;
  opacity:0;transition:opacity .12s;white-space:nowrap;
}
.tooltip.show{opacity:1;}

/* ── HINT ── */
.hint-bar{
  position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  background:rgba(33,31,26,.82);color:#fff;font-size:11px;
  font-family:'IBM Plex Mono',monospace;
  padding:6px 16px;border-radius:20px;letter-spacing:.06em;
  pointer-events:none;z-index:200;
  animation:fadein .6s 1s both, fadeout .5s 5s forwards;
}
@keyframes fadein{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes fadeout{to{opacity:0;}}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <div class="kicker">UniPi &middot; LEGeNds &middot; 2025&ndash;26</div>
    <h1>Work Breakdown <em>Structure</em></h1>
  </div>
  <div class="pills">
    <span class="pill">8 macro-aree</span>
    <span class="pill" id="pWP">— work package</span>
    <span class="pill" id="pTot">— nodi totali</span>
    <span class="zoom-badge" id="zoomBadge">100%</span>
  </div>
  <div class="hdr-btns">
    <button class="btn" id="btnExp">Espandi tutto</button>
    <button class="btn" id="btnCol">Comprimi L2+</button>
    <button class="btn" id="btnZoomIn">＋ Zoom</button>
    <button class="btn" id="btnZoomOut">－ Zoom</button>
    <button class="btn" id="btnReset">Reset zoom</button>
    <button class="btn primary" id="btnFit">↖ Centra</button>

</div>

<div class="leg-bar" id="legBar">

<div class="vp" id="vp">

    <div class="canvas" id="canvas">
      <svg class="tree-svg" id="svg"></svg>
    </div>

<div class="tooltip" id="tooltip"></div>
<div class="hint-bar">Click per espandere &middot; Scroll per zoom &middot; Trascina per navigare</div>

<script>

/* ═══════════════ TREE DATA (aggiornato) ═══════════════ */

/* ═══════════════ ENRICH ═══════════════ */
let uid=0;
function enrich(node,level,area){
  node.id=uid++;node.level=level;node.area=area;
  if(!node.children)node.children=[];
  node.collapsed=level>=1;
  node.children.forEach((c,i)=>enrich(c,level+1,level===0?i:area));
}
enrich(RAW,0,-1);

/* ═══════════════ LAYOUT ═══════════════ */
const NW=152, PAD=56, V_GAP=76, H_UNIT=168;
const NH=[68,56,46,40];

function getSpan(n){
  if(n.collapsed||!n.children.length)return 1;
  return n.children.reduce((s,c)=>s+getSpan(c),0);
}

let allNodes=[];
function layout(n,xStart,y){
  const span=getSpan(n);
  const h=NH[Math.min(n.level,NH.length-1)];
  n.x=xStart+span*H_UNIT/2-NW/2;
  n.y=y; n.w=NW; n.h=h;
  allNodes.push(n);
  if(!n.collapsed){
    let cx=xStart;
    n.children.forEach(c=>{const cs=getSpan(c);layout(c,cx,y+h+V_GAP);cx+=cs*H_UNIT;});
  }
}

/* ═══════════════ DOM POOL ═══════════════ */
const canvas=document.getElementById('canvas');
const svgEl=document.getElementById('svg');
const domMap={};

function nodeStyle(n){
  if(n.level===0)return{bg:'#211F1A',fg:'#F1ECE2',border:'#211F1A',codeFg:'rgba(241,236,226,.5)'};
  const ac=AC[n.area];
  if(n.level===1)return{bg:ac.color,fg:'#fff',border:ac.color,codeFg:'rgba(255,255,255,.55)'};
  if(n.level===2)return{bg:'#fff',fg:ac.color,border:ac.color+'66',codeFg:ac.color+'99'};
  return{bg:ac.bg,fg:ac.color,border:ac.color+'44',codeFg:ac.color+'88'};
}

function render(){
  allNodes=[];
  layout(RAW,PAD,PAD);

  let maxX=0,maxY=0;
  allNodes.forEach(n=>{maxX=Math.max(maxX,n.x+n.w+PAD);maxY=Math.max(maxY,n.y+n.h+PAD);});
  canvas.style.width=maxX+'px';canvas.style.height=maxY+'px';

  const seen=new Set();
  allNodes.forEach(n=>{
    seen.add(n.id);
    let el=domMap[n.id];
    if(!el){
      el=document.createElement('div');
      el.className='wbs-node';
      el.addEventListener('click',e=>{
        if(wasDragging)return;
        if(n.children.length){n.collapsed=!n.collapsed;render();}
      });
      // tooltip
      el.addEventListener('mouseenter',e=>{
        if(n.level>1){showTooltip(e,n.code+' — '+n.label);}
      });
      el.addEventListener('mousemove',e=>{moveTooltip(e);});
      el.addEventListener('mouseleave',()=>hideTooltip());
      canvas.appendChild(el);
      domMap[n.id]=el;
    }
    const st=nodeStyle(n);
    Object.assign(el.style,{
      left:n.x+'px',top:n.y+'px',width:n.w+'px',height:n.h+'px',
      background:st.bg,color:st.fg,borderColor:st.border,
      fontSize:n.level===0?'13px':n.level===1?'12px':'10.5px',
      fontWeight:n.level<=1?'700':'600',
      boxShadow:n.level<=1?'0 2px 8px rgba(33,31,26,.14),0 8px 24px rgba(33,31,26,.1)':'0 1px 4px rgba(33,31,26,.09)',
    });
    const hasKids=n.children.length>0;
    const hint=hasKids?(n.collapsed?`▾ ${n.children.length}`:'▴'):'';
    el.innerHTML=
      (n.level>0?`<div class="node-code" style="color:${st.codeFg}">${n.code}</div>`:'')
      +`<div class="node-label">${n.label}</div>`
      +(hint?`<div class="node-hint" style="color:${st.codeFg}">${hint}</div>`:'');
    el.style.display='flex';
  });

  Object.keys(domMap).forEach(id=>{
    if(!seen.has(+id)){domMap[id].remove();delete domMap[id];}
  });

  const paths=[];
  allNodes.forEach(n=>{
    if(n.collapsed)return;
    n.children.forEach(c=>{
      const x1=n.x+n.w/2,y1=n.y+n.h;
      const x2=c.x+c.w/2,y2=c.y;
      const ym=(y1+y2)/2;
      const ac=AC[c.area];
      const stroke=ac?ac.color+'99':'#DBD5C5';
      const sw=c.level<=2?2:1.4;
      paths.push(`<path d="M${x1},${y1}C${x1},${ym} ${x2},${ym} ${x2},${y2}" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round"/>`);
    });
  });
  svgEl.innerHTML=paths.join('');

  const leaves=countLeaves(RAW),total=countAll(RAW);
  document.getElementById('pWP').textContent=leaves+' work package';
  document.getElementById('pTot').textContent=total+' nodi';
}

function countAll(n){return 1+(n.children||[]).reduce((s,c)=>s+countAll(c),0);}
function countLeaves(n){if(!n.children||!n.children.length)return 1;return n.children.reduce((s,c)=>s+countLeaves(c),0);}

/* ═══════════════ TOOLTIP ═══════════════ */
const tip=document.getElementById('tooltip');
function showTooltip(e,txt){tip.textContent=txt;tip.classList.add('show');moveTooltip(e);}
function moveTooltip(e){tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-28)+'px';}
function hideTooltip(){tip.classList.remove('show');}

/* ═══════════════ LEGEND ═══════════════ */
const lb=document.getElementById('legBar');
AC.forEach((ac,i)=>{
  const sp=document.createElement('span');
  sp.className='leg-item';
  sp.title='Clicca per centrare';
  sp.innerHTML=`<span class="leg-dot" style="background:${ac.color}"></span>${AREA_LABELS[i]}`;
  // click on legend → scroll to that L1 node
  sp.addEventListener('click',()=>{
    const target=RAW.children[i];
    if(!target)return;
    // expand it
    target.collapsed=false;render();
    // center on it
    const el=domMap[target.id];
    if(!el)return;
    const nodeX=parseInt(el.style.left)+NW/2;
    const nodeY=parseInt(el.style.top)+target.h/2;
    panTo(nodeX,nodeY);
  });
  lb.appendChild(sp);
});

/* ═══════════════ PAN + ZOOM ═══════════════ */
const vp=document.getElementById('vp');
const wrap=document.getElementById('canvasWrap');
let scale=1, panX=0, panY=0;
let isDragging=false, wasDragging=false;
let startMX=0,startMY=0,startPX=0,startPY=0;
const DRAG_THRESHOLD=5;

function applyTransform(){
  wrap.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;
  document.getElementById('zoomBadge').textContent=Math.round(scale*100)+'%';
}

function clampPan(){
  // loose clamp — allow generous exploration
  const vw=vp.clientWidth, vh=vp.clientHeight;
  const cw=parseFloat(canvas.style.width)||2000;
  const ch=parseFloat(canvas.style.height)||1500;
  const minX=-(cw*scale-vw*0.2);
  const minY=-(ch*scale-vh*0.2);
  panX=Math.min(vw*0.8,Math.max(minX,panX));
  panY=Math.min(vh*0.8,Math.max(minY,panY));
}

vp.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  isDragging=true; wasDragging=false;
  startMX=e.clientX; startMY=e.clientY;
  startPX=panX; startPY=panY;
  vp.classList.add('dragging');
  e.preventDefault();
});
window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  const dx=e.clientX-startMX, dy=e.clientY-startMY;
  if(Math.abs(dx)+Math.abs(dy)>DRAG_THRESHOLD) wasDragging=true;
  panX=startPX+dx; panY=startPY+dy;
  clampPan();
  applyTransform();
});
window.addEventListener('mouseup',()=>{
  isDragging=false;
  vp.classList.remove('dragging');
  // reset wasDragging after a tick so click handler can read it
  setTimeout(()=>{wasDragging=false;},10);
});

// touch support
let touchStart=null;
vp.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY,px:panX,py:panY};
    wasDragging=false;
  }
},{passive:true});
vp.addEventListener('touchmove',e=>{
  if(!touchStart||e.touches.length!==1)return;
  const dx=e.touches[0].clientX-touchStart.x;
  const dy=e.touches[0].clientY-touchStart.y;
  if(Math.abs(dx)+Math.abs(dy)>DRAG_THRESHOLD) wasDragging=true;
  panX=touchStart.px+dx; panY=touchStart.py+dy;
  clampPan(); applyTransform();
  e.preventDefault();
},{passive:false});
vp.addEventListener('touchend',()=>{
  setTimeout(()=>{wasDragging=false;touchStart=null;},10);
});

// scroll = zoom
vp.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=vp.getBoundingClientRect();
  const mx=e.clientX-rect.left;
  const my=e.clientY-rect.top;
  const delta=-e.deltaY;
  const factor=delta>0?1.1:0.91;
  const newScale=Math.max(0.25,Math.min(3,scale*factor));
  // zoom toward cursor
  panX=mx-(mx-panX)*(newScale/scale);
  panY=my-(my-panY)*(newScale/scale);
  scale=newScale;
  clampPan(); applyTransform();
},{passive:false});

function panTo(nodeX,nodeY){
  const vw=vp.clientWidth,vh=vp.clientHeight;
  panX=vw/2-nodeX*scale;
  panY=vh/2-nodeY*scale;
  clampPan(); applyTransform();
}

/* ═══════════════ BUTTON CONTROLS ═══════════════ */
function setAll(n,v){if(n.children.length){n.collapsed=v;n.children.forEach(c=>setAll(c,v));}}
document.getElementById('btnExp').onclick=()=>{setAll(RAW,false);render();};
document.getElementById('btnCol').onclick=()=>{RAW.children.forEach(c=>setAll(c,true));render();};
document.getElementById('btnZoomIn').onclick=()=>{
  scale=Math.min(3,scale*1.2);
  const vw=vp.clientWidth,vh=vp.clientHeight;
  panX=vw/2-(vw/2-panX)*1.2; panY=vh/2-(vh/2-panY)*1.2;
  clampPan(); applyTransform();
};
document.getElementById('btnZoomOut').onclick=()=>{
  scale=Math.max(0.25,scale/1.2);
  const vw=vp.clientWidth,vh=vp.clientHeight;
  panX=vw/2-(vw/2-panX)/1.2; panY=vh/2-(vh/2-panY)/1.2;
  clampPan(); applyTransform();
};
document.getElementById('btnReset').onclick=()=>{
  scale=1; panX=0; panY=0; applyTransform();
};
document.getElementById('btnFit').onclick=()=>{
  scale=1; panX=0; panY=0;
  // center on root
  render();
  const root=domMap[RAW.id];
  if(root){
    const vw=vp.clientWidth;
    panX=vw/2-(parseInt(root.style.left)+NW/2)*scale;
    panY=20;
    clampPan(); applyTransform();
  }
};

/* ═══════════════ INIT ═══════════════ */
render();
// initial centering on root
setTimeout(()=>{
  const root=domMap[RAW.id];
  if(root){
    const vw=vp.clientWidth;
    panX=vw/2-(parseInt(root.style.left)+NW/2);
    panY=20;
    clampPan(); applyTransform();
  }
},60);
</script>
